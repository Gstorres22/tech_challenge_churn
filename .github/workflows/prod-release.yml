name: Prod Validation & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prod-checks:
    name: Validação Final de Produção
    uses: ./.github/workflows/_homol-checks.yml

  publish-release:
    name: Tag, Release, Limpeza e Back-Merge Condicional
    needs: prod-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar tag e criar versão semver
        id: check-and-tag
        run: |
          git fetch --tags
          existing_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "$existing_tag" ]; then
            echo "HEAD já possui a tag $existing_tag. Nenhuma nova release será criada."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(python3 .github/scripts/versioning.py next)
          release_branch=$(python3 .github/scripts/versioning.py branch --version "$version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

          {
            echo "should_release=true"
            echo "version=$version"
            echo "release_branch=$release_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Publicar GitHub Release
        if: steps.check-and-tag.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.check-and-tag.outputs.version }}";
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Release ${version}`,
              generate_release_notes: true,
            });

      - name: Remover branch release/vX.Y.Z encerrada
        if: steps.check-and-tag.outputs.should_release == 'true'
        run: |
          release_branch="${{ steps.check-and-tag.outputs.release_branch }}"
          if git ls-remote --exit-code --heads origin "$release_branch" >/dev/null 2>&1; then
            git push origin --delete "$release_branch"
            echo "Branch $release_branch removida após publicação da release."
          else
            echo "Branch $release_branch não existe mais no remoto (já removida)."
          fi

      - name: Sincronizar ajustes exclusivos de Homol/Main para develop
        id: sync-develop
        if: steps.check-and-tag.outputs.should_release == 'true'
        run: |
          version="${{ steps.check-and-tag.outputs.version }}"
          main_sha=$(git rev-parse HEAD)
          git fetch origin +refs/heads/develop:refs/remotes/origin/develop

          needs_sync=$(python3 .github/scripts/versioning.py check-backmerge \
            --source-ref "$main_sha" \
            --develop-ref origin/develop)

          if [ "$needs_sync" != "true" ]; then
            echo "Homol/Main não possui ajustes ausentes na develop. Back-merge não necessário."
            echo "sync_status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B develop origin/develop

          if git merge --no-ff "$main_sha" -m "chore(sync): back-merge Release $version para develop"; then
            git push origin develop
            echo "Back-merge concluído com sucesso na develop."
            echo "sync_status=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "Conflito detectado ao sincronizar main -> develop. Será aberto PR de sincronização."
            echo "sync_status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir PR de back-merge em caso de conflito
        if: steps.sync-develop.outputs.sync_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.check-and-tag.outputs.version }}";
            const title = `chore(sync): back-merge Release ${version} para develop`;
            const body = [
              `## Back-merge pendente — Release ${version}`,
              "",
              "A release promovida para `main` continha ajustes feitos em Homol/Main que conflitaram com novos commits já existentes em `develop`.",
              "",
              "Resolva os conflitos deste PR (`main` → `develop`) para manter `develop` sincronizada com produção.",
            ].join("\n");

            const { data: openPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:main`,
              base: "develop",
              state: "open",
            });

            if (openPrs.length > 0) {
              const existing = openPrs[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: existing.number,
                title,
                body,
              });
              core.info(`PR de back-merge #${existing.number} atualizado.`);
              return;
            }

            const { data: created } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: "main",
              base: "develop",
              body,
            });
            core.info(`PR de back-merge #${created.number} criado (main -> develop).`);
