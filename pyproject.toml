[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "Modelo de previsão de churn de clientes, do EDA ao deploy em produção na AWS."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gabriel Torres" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",          # requerido pelo TestClient do FastAPI
    "ruff>=0.6",
    "pre-commit>=3.7",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[project.scripts]
churn-train = "churn.train:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806"]  # permite X, X_train etc. (convenção de ML)

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["churn"]
branch = true
